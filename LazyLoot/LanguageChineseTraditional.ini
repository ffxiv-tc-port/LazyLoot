Diagnostics & Troubleshooting==診斷與疑難排解
Diagnostics Mode==診斷模式
Outputs additional messages to chat whenever an item is passed, with reasons. This is useful for helping to diagnose issues with the developers or for understanding why LazyLoot makes decisions to pass on items.\n\nThese messages will only be displayed to you, nobody else in-game can see them.==每當道具被放棄時，會在聊天欄輸出附帶原因的額外訊息。這有助於向開發者反映問題，或了解 LazyLoot 為何決定放棄該道具。\n\n這些訊息只有你自己看得到，其他玩家無法看見。
Don't pass on items that fail to roll.==擲骰失敗時不要放棄道具。
Normally LazyLoot will pass on items that fail to roll. Enabling this option will prevent it from passing in those situations. Be warned there could be weird side effects doing this and should only be used if you're running into issues with emergency passing appearing.==正常情況下 LazyLoot 會在擲骰失敗時放棄該道具。啟用此選項可防止在這種情況下放棄道具。請注意這樣做可能會有異常的副作用，僅建議在遇到緊急放棄問題時才使用。
LazyLoot Rolling Commands==LazyLoot 擲骰指令
Roll need for everything. If impossible, roll greed (or pass if greed is impossible).==對所有道具擲需要。若無法擲需要，則擲貪要（若也無法擲貪要則放棄）。
Roll greed for everything. If impossible, roll pass.==對所有道具擲貪要。若無法擲貪要，則放棄。
Pass on things you haven't rolled for yet.==放棄尚未擲骰的道具。
Rolling Command Delay==擲骰指令延遲
Rolling delay between items==道具間的擲骰延遲
Only Untradeables==僅限不可交易物品
Settings in this page will apply to every single item, even if they are tradeable or not.==此頁面的設定適用於所有道具，無論是否可交易。
Pass on items with an item level below==放棄裝備等級低於以下數值的道具
Pass on all items already unlocked. (Triple Triad Cards, Orchestrions, Faded Copies, Minions, Mounts, Emotes, Hairstyles)==放棄所有已解鎖的道具。（九宮幻卡、管弦樂琴樂譜、褪色複製品、寵物、坐騎、表情動作、髮型）
Pass on unlocked Mounts.==放棄已解鎖的坐騎。
Pass on unlocked Minions.==放棄已解鎖的寵物。
Pass on unlocked Bardings.==放棄已解鎖的坐騎裝甲。
Pass on unlocked Triple Triad cards.==放棄已解鎖的九宮幻卡。
Pass on unlocked Emotes and Hairstyle.==放棄已解鎖的表情動作與髮型。
Pass on unlocked Orchestrion Rolls.==放棄已解鎖的管弦樂琴樂譜。
Pass on unlocked Faded Copies.==放棄已解鎖的褪色複製品。
Pass on items I can't use with current job.==放棄目前職業無法使用的道具。
Don't roll on items or duties with a weekly lockout.==不對有每週次數限制的道具或任務擲骰。

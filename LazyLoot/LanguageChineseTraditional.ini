Fancy Ultimate Lazy Feature==懶人終極自動擲骰功能
Fancy Ultimate Lazy Feature (FULF) is a set and forget feature that will automatically roll on items for you instead of having to use the commands above.==懶人終極自動擲骰功能（FULF）是一項設定後即可自動運作的功能，會自動幫你對道具擲骰，不需再手動輸入上方的指令。
Set FULF to Needing mode, where it will follow the /lazy need rules.==將 FULF 設為需要模式，依照 /lazy need 的規則運作。
Set FULF to Greeding mode, where it will follow the /lazy greed rules.==將 FULF 設為貪要模式，依照 /lazy greed 的規則運作。
Set FULF to Passing mode, where it will follow the /lazy pass rules.==將 FULF 設為放棄模式，依照 /lazy pass 的規則運作。
FULF Enabled==FULF 已啟用
FULF Disabled==FULF 已停用
Weekly Lockout Duty detected: FULF and /lazy rolls are temporarily disabled until you leave this duty or disable the weekly lockout setting.==偵測到每週次數限制任務：FULF 與 /lazy 擲骰已暫時停用，直到你離開此任務或停用每週次數限制設定為止。
